# =============================================================================
# WebStatus 网站状态监控 - Nginx 反向代理完整配置示例
# 使用说明：
#   1. 复制本文件到 /etc/nginx/conf.d/webstatus.conf
#   2. 将下方 server_name 替换为你的域名，SSL 证书路径改为实际路径
#   3. 确认 proxy_pass 的端口与 config.json 中 app.port 一致（默认 3000）
#   4. 执行：nginx -t && systemctl reload nginx
# 覆盖内容：反向代理 / 伪静态 / 安全头 / 双重限流 / 静态资源缓存 / 上传大小限制 /
#           敏感文件访问禁止 / 压缩（gzip / Brotli 示例）
# =============================================================================

# =============================================================================
# 【可选】gzip 压缩（以下指令属于 http{} 层，须放在 server{} 之外，
# 通常写在 nginx.conf 主配置或本文件顶部。默认已注释，取消注释并 reload 生效）
# =============================================================================
# gzip on;
# gzip_comp_level 5;
# gzip_min_length 1k;
# gzip_buffers 16 8k;
# gzip_vary on;
# gzip_types
#   text/plain text/css application/javascript application/json
#   application/xml application/xml+rss text/javascript image/svg+xml
#   application/vnd.ms-fontobject application/x-font-ttf font/opentype;

# =============================================================================
# 【可选】Brotli 压缩（需 ngx_http_brotli 模块，如发行版自带的
# nginx-mod-http-brotli / libnginx-mod-http-brotli-filter）。优先级高于 gzip，
# Nginx 会按 Accept-Encoding 自动协商。启用 Brotli 后可与 gzip 并存。
# =============================================================================
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 1k;
# brotli_static on;                 # 直接使用预压缩的 .br 静态文件（如存在）
# brotli_types
#   text/plain text/css application/javascript application/json
#   text/javascript image/svg+xml;

# ---------------- 限流区域定义（内存共享） ----------------
# 公开接口限流：每个 IP 平均 10 次/秒
limit_req_zone $binary_remote_addr zone=ws_pub:10m rate=10r/s;
# 登录接口限流：每个 IP 每 30 秒 1 次（平均 2次/分钟），更严格
limit_req_zone $binary_remote_addr zone=ws_login:10m rate=2r/m;

# ---------------- HTTP -> HTTPS 跳转 ----------------
server {
    listen 80;
    server_name status.example.com;
    return 301 https://$host$request_uri;
}

# ---------------- HTTPS 主站 ----------------
server {
    listen 443 ssl http2;
    server_name status.example.com;

    # ===== SSL 证书 =====
    ssl_certificate     /etc/nginx/ssl/status.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/status.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;

    # ===== 安全响应头 =====
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "0" always;

    # ===== 伪静态 / history 模式：全部请求转发给 Node 应用处理 =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_buffering       off;
    }

    # ===== 静态资源缓存（/assets 前端资源，1 天） =====
    # 前端资源均以 /assets/ 为前缀（含本地化的 vendor 文件：/assets/vendor/*），
    # 此规则自动覆盖，无需修改 HTML 引用方式。若上方开启了 gzip/brotli，
    # Nginx 会按 Accept-Encoding 自动对响应压缩；也可配合 proxy_cache 进一步缓存。
    location ~ ^/assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # 压缩示例：即使不开启全局 gzip，也可仅对静态资源按 MIME 压缩
        # gzip on;
        # gzip_types text/css application/javascript text/javascript image/svg+xml;
        # gzip_min_length 1k;
        # gzip_vary on;
    }

    # ===== 公开状态接口限流 =====
    location = /api/public/status {
        limit_req zone=ws_pub burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 登录接口更严格限流 + 请求体限制 =====
    location = /api/auth/login {
        limit_req zone=ws_login burst=5;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 安装向导：允许上传 SQL 备份（限制最大 20MB） =====
    location /install {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 禁止访问敏感文件（双保险，Node 端亦不会暴露） =====
    location ~* ^/config(\.json)?$ { deny all; }
    location ~* \.(sql|log|env|lock)$ { deny all; }
    location ~ /\. { deny all; }
}
