<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - WebStatus 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="admin-shell"></div>
  <script src="/assets/js/common.js"></script>
  <script>
  (() => {
    const { api, esc, h, icon, toast } = WebStatus;
    const inp = 'w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500';

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/settings');
      const page = h('div', 'px-4 sm:px-6 py-6 max-w-4xl mx-auto space-y-6');
      main.appendChild(page);
      page.appendChild(h('h1', 'text-xl font-bold', '系统设置'));

      /* ---------- 业务参数 ---------- */
      const paramBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5');
      paramBox.appendChild(h('h2', 'text-sm font-semibold mb-4', '业务参数'));
      const form = h('div', 'grid grid-cols-1 sm:grid-cols-2 gap-4');
      paramBox.appendChild(form);
      const fields = {
        slow_threshold: { label: '卡顿延迟阈值(ms)', min: 100 },
        check_interval: { label: '巡检间隔(秒)', min: 10 },
        alert_streak: { label: '抖动抑制·连续异常次数', min: 1 },
        alert_cooldown: { label: '邮件告警冷却(秒)', min: 0 },
        history_retention_days: { label: '历史数据保留(天)', min: 1 },
        log_retention_days: { label: '日志保留(天)', min: 1 },
        cache_ttl: { label: '公开缓存 TTL(秒)', min: 1 },
        frontend_refresh: { label: '前端刷新间隔(秒)', min: 5 },
        max_upload_size: { label: 'SQL 备份上传上限(MB)', min: 1 }
      };
      Object.keys(fields).forEach(k => {
        const d = fields[k];
        const w = h('div', '');
        w.appendChild(h('label', 'block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5', d.label));
        const input = h('input', inp);
        input.type = 'number';
        input.id = 'par-' + k;
        input.min = d.min;
        w.appendChild(input);
        form.appendChild(w);
      });
      const saveBtn = h('button', 'mt-5 px-5 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium', '保存业务参数');
      paramBox.appendChild(saveBtn);
      page.appendChild(paramBox);

      api('/api/admin/settings/params').then(r => {
        Object.keys(fields).forEach(k => {
          const el = document.getElementById('par-' + k);
          if (el && r.data[k] !== undefined) el.value = r.data[k];
        });
      }).catch(e => toast(e.message, 'error'));

      saveBtn.addEventListener('click', async () => {
        const body = {};
        Object.keys(fields).forEach(k => { body[k] = Number(document.getElementById('par-' + k).value); });
        try {
          await api('/api/admin/settings/params', { method: 'POST', body });
          toast('业务参数已保存', 'success');
        } catch (e) { toast(e.message, 'error'); }
      });

      /* ---------- 运维操作 ---------- */
      const opsBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5');
      opsBox.appendChild(h('h2', 'text-sm font-semibold mb-4', '运维操作'));
      const ops = [
        { key: 'export', label: '导出数据库备份', desc: '下载完整 .sql 备份文件，可用于安装向导「模式 B」恢复', icon: 'download', cls: 'btn-primary' },
        { key: 'run', label: '手动触发完整巡检', desc: '立即对所有启用站点执行一轮探测', icon: 'activity', cls: 'btn-normal' },
        { key: 'clear-history', label: '清空监控历史', desc: '删除全部状态历史数据（不可恢复）', icon: 'database', cls: 'btn-danger' },
        { key: 'clear-faults', label: '清空故障日志', desc: '删除全部故障记录（不可恢复）', icon: 'alertTriangle', cls: 'btn-danger' },
        { key: 'clear-mails', label: '清空邮件发送日志', desc: '删除全部邮件发送记录（不可恢复）', icon: 'mail', cls: 'btn-danger' }
      ];
      ops.forEach(o => {
        const el = h('div', 'flex items-center gap-3 py-3 border-b border-slate-100 dark:border-slate-800 last:border-0');
        el.appendChild(h('div', 'flex-1 min-w-0',
          '<div class="flex items-center gap-2"><span class="text-slate-400">' + icon(o.icon, 'w-4 h-4') + '</span><span class="text-sm font-medium">' + o.label + '</span></div>' +
          '<div class="text-xs text-slate-400 mt-0.5">' + o.desc + '</div>'));
        const btn = h('button', 'px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap ' +
          (o.cls === 'btn-danger' ? 'text-red-600 border border-red-200 dark:border-red-500/30 hover:bg-red-50 dark:hover:bg-red-500/10'
            : o.cls === 'btn-primary' ? 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900'
            : 'border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800'), o.label);
        btn.addEventListener('click', () => doOp(o.key));
        el.appendChild(btn);
        opsBox.appendChild(el);
      });
      page.appendChild(opsBox);

      async function doOp(key) {
        if (key === 'export') {
          window.open('/api/admin/settings/export-backup', '_blank');
          return;
        }
        const confirmText = key === 'run' ? '确定立即执行一轮完整巡检？'
          : key === 'clear-history' ? '确定清空全部监控历史数据？此操作不可恢复！'
          : key === 'clear-faults' ? '确定清空全部故障日志？此操作不可恢复！'
          : '确定清空全部邮件发送日志？此操作不可恢复！';
        if (!confirm(confirmText)) return;
        try {
          const r = await api('/api/admin/settings/' + key, { method: 'POST' });
          toast(r.message || '操作成功', 'success');
          if (key === 'run' && r.data) {
            toast('本轮：' + r.data.total + ' 站，正常 ' + r.data.up + '，卡顿 ' + r.data.slow + '，离线 ' + r.data.down, 'success');
          }
        } catch (e) { toast(e.message, 'error'); }
      }

      /* ---------- 服务运行状态 ---------- */
      const svcBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5');
      svcBox.appendChild(h('h2', 'text-sm font-semibold mb-4', '服务运行状态'));
      const svcContent = h('div', 'text-sm space-y-2');
      svcBox.appendChild(svcContent);
      page.appendChild(svcBox);

      async function loadSvc() {
        try {
          const r = await api('/api/admin/settings/service');
          const s = r.data;
          const run = s.lastRun || {};
          svcContent.innerHTML = '';
          svcContent.appendChild(h('div', 'flex items-center gap-2',
            '<span class="w-2.5 h-2.5 rounded-full ' + (s.running ? 'bg-emerald-500' : 'bg-red-500') + '"></span>' +
            '<span class="font-medium">' + (s.running ? '巡检任务运行中' : '巡检任务未运行') + '</span>' +
            (s.inRound ? '<span class="text-xs text-blue-500">本轮探测进行中…</span>' : '')));
          svcContent.appendChild(h('div', 'text-xs text-slate-400', '上次巡检时间：' + esc(s.lastRunAt || '尚未运行')));
          if (run.total !== undefined) {
            svcContent.appendChild(h('div', 'text-xs text-slate-400 tabular',
              '最近一轮：站点 ' + run.total + ' · 正常 ' + run.up + ' · 卡顿 ' + run.slow + ' · 离线 ' + run.down + ' · 维修 ' + run.maintenance +
              (run.errors && run.errors.length ? ' · 错误 ' + run.errors.length : '')));
          }
          svcContent.appendChild(h('div', 'text-xs text-slate-400', '巡检模式：仅后端定时任务，页面访问不触发探测'));
        } catch (e) { /* ignore */ }
      }
      loadSvc();
      setInterval(loadSvc, 15000);
    })();
  })();
  </script>
</body>
</html>
