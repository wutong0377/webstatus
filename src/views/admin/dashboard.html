<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 - WebStatus 管理后台</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=2.1.0">
</head>
<body>
  <div id="admin-shell"></div>
  <script src="/assets/js/common.js?v=2.1.0"></script>
  <script>
  (() => {
    const { api, esc, h, icon, toast, STATUS_META, fmtDelay, fmtTime, t, tStatus, skeleton } = WebStatus;

    let data = null;

    /* 用已缓存数据整页重渲染（含语言切换后的文案刷新） */
    function render() {
      const main = document.getElementById('ws-main');
      const page = main && main.firstChild;
      if (!data || !page) return;
      page.innerHTML = '';
      page.appendChild(h('h1', 'text-xl font-bold mb-5', t('nav.dashboard')));

      const grid = h('div', 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6');
      page.appendChild(grid);
      const c = data.counts || {};
      const cards = [
        { label: t('dashboard.total'), val: c.total, cls: 'text-slate-800 dark:text-slate-100' },
        { label: t('status.up'), val: c.up, cls: 'text-emerald-600 dark:text-emerald-400' },
        { label: t('status.slow'), val: c.slow, cls: 'text-amber-600 dark:text-amber-400' },
        { label: t('status.down'), val: c.down, cls: 'text-red-600 dark:text-red-400' },
        { label: t('status.maintenance'), val: c.maintenance, cls: 'text-blue-600 dark:text-blue-400' }
      ];
      cards.forEach(it => {
        grid.appendChild(h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4',
          '<div class="text-xs text-slate-400">' + esc(it.label) + '</div><div class="text-2xl font-bold tabular mt-1 ' + it.cls + '">' + it.val + '</div>'));
      });

      // 服务状态
      const svc = data.service || {};
      const svcCard = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 mb-6 flex items-center gap-3 flex-wrap');
      svcCard.appendChild(h('span', 'w-2.5 h-2.5 rounded-full ' + (svc.running ? 'bg-emerald-500' : 'bg-red-500')));
      svcCard.appendChild(h('span', 'text-sm font-medium', svc.running ? t('dashboard.svcRunning') : t('dashboard.svcStopped')));
      svcCard.appendChild(h('span', 'text-xs text-slate-400', t('dashboard.lastRun') + esc(svc.lastRunAt || t('dashboard.neverRun'))));
      if (svc.lastRun && svc.lastRun.total !== undefined) {
        svcCard.appendChild(h('span', 'text-xs text-slate-400 tabular',
          esc(t('dashboard.round').replace('{total}', svc.lastRun.total).replace('{up}', svc.lastRun.up).replace('{slow}', svc.lastRun.slow).replace('{down}', svc.lastRun.down).replace('{maintenance}', svc.lastRun.maintenance))));
      }
      page.appendChild(svcCard);

      const cols = h('div', 'grid grid-cols-1 lg:grid-cols-2 gap-5');
      page.appendChild(cols);

      // 最近故障
      const faultBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5');
      faultBox.appendChild(h('h2', 'text-sm font-semibold mb-4', t('dashboard.recentFaults')));
      if (!(data.recentFaults || []).length) {
        faultBox.appendChild(h('div', 'text-sm text-slate-400 text-center py-6', t('dashboard.noFaults')));
      } else {
        data.recentFaults.forEach(f => {
          const meta = STATUS_META[f.fault_status] || STATUS_META[0];
          const item = h('div', 'flex items-center gap-3 py-2.5 border-b border-slate-100 dark:border-slate-800 last:border-0');
          item.appendChild(h('span', 'w-2 h-2 rounded-full flex-shrink-0 ' + meta.dot));
          const body = h('div', 'flex-1 min-w-0');
          body.appendChild(h('div', 'text-sm font-medium truncate', esc(f.site_name)));
          body.appendChild(h('div', 'text-xs text-slate-400 truncate', esc(f.error_code || (f.error_msg || ''))));
          item.appendChild(body);
          item.appendChild(h('span', 'text-xs text-slate-400 tabular', esc(String(f.started_at || '').slice(5, 16))));
          faultBox.appendChild(item);
        });
      }
      cols.appendChild(faultBox);

      // 最近邮件
      const mailBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5');
      mailBox.appendChild(h('h2', 'text-sm font-semibold mb-4', t('dashboard.recentMails')));
      if (!(data.recentMails || []).length) {
        mailBox.appendChild(h('div', 'text-sm text-slate-400 text-center py-6', t('dashboard.noMails')));
      } else {
        data.recentMails.forEach(m => {
          const item = h('div', 'flex items-center gap-3 py-2.5 border-b border-slate-100 dark:border-slate-800 last:border-0');
          item.appendChild(h('span', 'w-2 h-2 rounded-full flex-shrink-0 ' + (m.status === 1 ? 'bg-emerald-500' : 'bg-red-500')));
          const body = h('div', 'flex-1 min-w-0');
          body.appendChild(h('div', 'text-sm truncate', esc(m.to_email)));
          body.appendChild(h('div', 'text-xs text-slate-400',
            esc(m.mail_type === 'alert' ? t('mailType.alert') : m.mail_type === 'recover' ? t('mailType.recover') : t('mailType.test')) +
            (m.status === 1 ? '' : ' · ' + esc(m.error_msg || t('common.failed')))));
          item.appendChild(body);
          item.appendChild(h('span', 'text-xs text-slate-400 tabular', esc(String(m.created_at || '').slice(5, 16))));
          mailBox.appendChild(item);
        });
      }
      cols.appendChild(mailBox);
    }

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/dashboard');
      main.innerHTML = '';
      main.appendChild(h('div', 'px-4 sm:px-6 py-6 max-w-6xl mx-auto'));

      const page = main.firstChild;
      page.appendChild(h('h1', 'text-xl font-bold mb-5', t('nav.dashboard')));
      const grid = h('div', 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6');
      page.appendChild(grid);
      // 统计卡骨架
      for (let i = 0; i < 5; i++) grid.appendChild(skeleton('h-20'));

      const loading = h('div', 'text-center py-10 text-slate-400', t('common.loading'));
      page.appendChild(loading);

      try {
        const r = await api('/api/admin/dashboard/overview');
        data = r.data;
      } catch (e) {
        loading.textContent = e.message || t('common.loadFailed');
        return;
      }
      loading.remove();
      render();

      // 切换语言时重渲染整页
      document.addEventListener('ws-langchange', render);
    })();
  })();
  </script>
</body>
</html>
