<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告管理 - WebStatus 管理后台</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=2.2.0">
</head>
<body>
  <div id="admin-shell"></div>

  <!-- 弹窗 -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" data-close></div>
    <div class="absolute inset-y-0 right-0 w-full max-w-lg bg-white dark:bg-slate-900 shadow-xl overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-5">
          <h2 id="modal-title" class="text-lg font-bold">发布公告</h2>
          <button data-close class="p-2 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <form id="notice-form" class="space-y-4">
          <input type="hidden" id="f-id">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="notices.field.title">公告标题 *</label>
            <input id="f-title" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" maxlength="200">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="notices.field.content">公告内容（支持简单 HTML）</label>
            <textarea id="f-content" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" rows="5"></textarea>
          </div>
          <div class="flex items-center gap-6">
            <label class="flex items-center gap-2.5 text-sm cursor-pointer">
              <input type="checkbox" id="f-pinned" class="w-4 h-4 accent-blue-600"><span data-i18n="notices.pinned">置顶</span>
            </label>
            <div class="flex-1">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="notices.field.sort">排序</label>
              <input id="f-sort" type="number" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm" value="0">
            </div>
          </div>
          <div id="form-err" class="hidden text-sm text-red-600 bg-red-50 dark:bg-red-500/10 rounded-lg px-3 py-2"></div>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" data-close class="px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium" data-i18n="common.cancel">取消</button>
            <button type="submit" class="px-5 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium" data-i18n="common.save">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/assets/js/common.js?v=2.2.0"></script>
  <script>
  (() => {
    const { api, esc, h, icon, toast, t } = WebStatus;
    let notices = [];

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/notices');
      const page = h('div', 'px-4 sm:px-6 py-6 max-w-4xl mx-auto');
      main.appendChild(page);
      page.appendChild(h('div', 'flex items-center justify-between mb-5',
        '<h1 class="text-xl font-bold" data-i18n="nav.notices">' + t('nav.notices') + '</h1>' +
        '<button id="add-btn" class="px-4 py-2 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium" data-i18n="notices.publish">' + t('notices.publish') + '</button>'));

      const list = h('div', 'space-y-2.5');
      page.appendChild(list);

      function render() {
        list.innerHTML = '';
        if (!notices.length) {
          list.appendChild(h('div', 'text-center py-10 text-slate-400 text-sm', t('notices.empty')));
          return;
        }
        notices.forEach(n => {
          if (!n) return;
          const el = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4');
          const top = h('div', 'flex items-center gap-2 flex-wrap');
          if (n.is_pinned === 1) {
            top.appendChild(h('span', 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400', icon('megaphone', 'w-3 h-3') + t('notices.pinned')));
          }
          top.appendChild(h('span', 'font-medium', esc(n.title)));
          top.appendChild(h('span', 'text-xs text-slate-400 ml-auto', esc(n.created_at)));
          el.appendChild(top);
          if (n.content) el.appendChild(h('div', 'mt-2 text-sm text-slate-500 dark:text-slate-400', n.content));
          const actions = h('div', 'mt-3 flex items-center gap-2');
          const edit = h('button', 'px-2.5 py-1 rounded-lg text-xs text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800', t('common.edit'));
          edit.addEventListener('click', () => openEdit(n));
          actions.appendChild(edit);
          const del = h('button', 'px-2.5 py-1 rounded-lg text-xs text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10', t('common.delete'));
          del.addEventListener('click', () => doDelete(n));
          actions.appendChild(del);
          el.appendChild(actions);
          list.appendChild(el);
        });
      }

      async function load() {
        list.innerHTML = '';
        for (let i = 0; i < 3; i++) list.appendChild(WebStatus.skeleton('h-16'));
        try {
          const r = await api('/api/admin/notices');
          notices = r.data || [];
          render();
        } catch (e) { list.innerHTML = ''; toast(e.message, 'error'); }
      }

      /* 弹窗 */
      const modal = document.getElementById('modal');
      function fill(n) {
        document.getElementById('f-id').value = n.id || '';
        document.getElementById('f-title').value = n.title || '';
        document.getElementById('f-content').value = n.content || '';
        document.getElementById('f-pinned').checked = n.is_pinned === 1;
        document.getElementById('f-sort').value = n.sort || 0;
        document.getElementById('form-err').classList.add('hidden');
      }
      function openEdit(n) {
        document.getElementById('modal-title').textContent = t('notices.edit');
        fill(n);
        modal.classList.remove('hidden');
      }
      document.getElementById('add-btn').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = t('notices.publish');
        fill({});
        modal.classList.remove('hidden');
      });
      modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => modal.classList.add('hidden')));

      document.getElementById('notice-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const id = document.getElementById('f-id').value;
        const body = {
          title: document.getElementById('f-title').value.trim(),
          content: document.getElementById('f-content').value,
          is_pinned: document.getElementById('f-pinned').checked,
          sort: Number(document.getElementById('f-sort').value) || 0
        };
        try {
          if (id) await api('/api/admin/notices/' + id + '/update', { method: 'POST', body });
          else await api('/api/admin/notices/create', { method: 'POST', body });
          modal.classList.add('hidden');
          toast(t('common.saved'), 'success');
          load();
        } catch (e) {
          const err = document.getElementById('form-err');
          err.textContent = e.message;
          err.classList.remove('hidden');
        }
      });

      async function doDelete(n) {
        if (!confirm(t('notices.confirmDelete').replace('{title}', n.title || ''))) return;
        try {
          await api('/api/admin/notices/' + n.id + '/delete', { method: 'POST' });
          toast(t('common.deleted'), 'success');
          load();
        } catch (e) { toast(e.message, 'error'); }
      }

      // 切换语言后重渲染列表与弹窗标题
      document.addEventListener('ws-langchange', () => { render(); });

      load();
    })();
  })();
  </script>
</body>
</html>
