<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号管理 - WebStatus 管理后台</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=2.4.0">
</head>
<body>
  <div id="admin-shell"></div>

  <!-- 新增/编辑账号弹窗 -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" data-close></div>
    <div class="absolute inset-y-0 right-0 w-full max-w-md bg-white dark:bg-slate-900 shadow-xl overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-5">
          <h2 id="modal-title" class="text-lg font-bold">新增账号</h2>
          <button data-close class="p-2 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <form id="acc-form" class="space-y-4">
          <input type="hidden" id="f-id">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">用户名 *</label>
            <input id="f-username" class="inp" maxlength="50" autocomplete="off">
            <p id="username-hint" class="text-xs text-slate-400 mt-1"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">显示名称</label>
            <input id="f-display" class="inp" maxlength="50">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">角色 *</label>
            <select id="f-role" class="inp">
              <option value="admin">admin - 管理员（可写）</option>
              <option value="super">super - 超级管理员</option>
              <option value="readonly">readonly - 只读</option>
            </select>
          </div>
          <div>
            <label id="pwd-label" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">密码 *</label>
            <input id="f-password" type="password" class="inp" maxlength="72" autocomplete="new-password">
          </div>
          <div id="form-err" class="hidden text-sm text-red-600 bg-red-50 dark:bg-red-500/10 rounded-lg px-3 py-2"></div>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" data-close class="px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium">取消</button>
            <button type="submit" class="px-5 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 两步验证设置弹窗 -->
  <div id="tfa-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" data-tfa-close></div>
    <div class="absolute inset-y-0 right-0 w-full max-w-md bg-white dark:bg-slate-900 shadow-xl overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold">两步验证（TOTP）</h2>
          <button data-tfa-close class="p-2 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div id="tfa-body"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/common.js?v=2.4.0"></script>
  <script>
  (() => {
    const { api, esc, h, icon, toast } = WebStatus;
    const inp = 'w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500';
    document.querySelectorAll('.inp').forEach(e => e.className = e.className.replace('inp', '') + ' ' + inp);

    const ROLE_BADGE = {
      super: 'bg-purple-50 text-purple-700 ring-purple-600/20 dark:bg-purple-500/10 dark:text-purple-400',
      admin: 'bg-blue-50 text-blue-700 ring-blue-600/20 dark:bg-blue-500/10 dark:text-blue-400',
      readonly: 'bg-slate-100 text-slate-600 ring-slate-500/20 dark:bg-slate-700/40 dark:text-slate-300'
    };

    let accounts = [];

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/accounts');
      const page = h('div', 'px-4 sm:px-6 py-6 max-w-5xl mx-auto');
      main.appendChild(page);

      page.appendChild(h('div', 'flex items-center justify-between mb-5 flex-wrap gap-3',
        '<h1 class="text-xl font-bold">账号管理</h1>' +
        '<button id="add-btn" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium">新增账号</button>'));

      const box = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden');
      page.appendChild(box);
      const tableWrap = h('div', 'overflow-x-auto');
      box.appendChild(tableWrap);
      const table = h('table', 'w-full text-sm');
      table.innerHTML = '<thead><tr class="text-left text-xs text-slate-400 border-b border-slate-200 dark:border-slate-800">' +
        '<th class="px-4 py-3 font-medium">账号</th>' +
        '<th class="px-4 py-3 font-medium">角色</th>' +
        '<th class="px-4 py-3 font-medium">2FA</th>' +
        '<th class="px-4 py-3 font-medium">创建时间</th>' +
        '<th class="px-4 py-3 font-medium">最后登录</th>' +
        '<th class="px-4 py-3 font-medium text-right">操作</th></tr></thead>';
      const tbody = h('tbody', '');
      table.appendChild(tbody);
      tableWrap.appendChild(table);

      const emptyRow = () => h('tr', '', '<td colspan="6" class="px-4 py-10 text-center text-slate-400">暂无账号</td>');

      function renderTable() {
        tbody.innerHTML = '';
        if (!accounts.length) { tbody.appendChild(emptyRow()); return; }
        accounts.forEach(a => {
          const tr = h('tr', 'border-b border-slate-100 dark:border-slate-800 last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/50');
          const cell = c => 'px-4 py-3 ' + c;

          const nameCell = h('td', cell(''));
          const nameWrap = h('div', 'flex items-center gap-2');
          nameWrap.appendChild(h('span', 'font-medium', esc(a.username)));
          if (a.current) nameWrap.appendChild(h('span', 'px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-400', '当前'));
          nameCell.appendChild(nameWrap);
          if (a.display_name) nameCell.appendChild(h('div', 'text-xs text-slate-400', esc(a.display_name)));
          tr.appendChild(nameCell);

          tr.appendChild(h('td', cell(''), '<span class="px-2 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset ' + (ROLE_BADGE[a.role] || ROLE_BADGE.admin) + '">' + esc(a.role) + '</span>'));

          tr.appendChild(h('td', cell(''),
            a.twofa_enabled
              ? '<span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-400">已启用</span>'
              : '<span class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-500 ring-1 ring-inset ring-slate-500/20 dark:bg-slate-700/40 dark:text-slate-300">未启用</span>'));

          tr.appendChild(h('td', cell('text-xs text-slate-500'), esc(a.created_at)));
          tr.appendChild(h('td', cell('text-xs text-slate-500'), esc(a.last_login_at || '-')));

          const act = h('td', cell('text-right whitespace-nowrap'));
          const btnCls = 'px-2.5 py-1.5 rounded-lg text-xs hover:bg-slate-100 dark:hover:bg-slate-800';
          const edit = h('button', btnCls + ' text-slate-600', '编辑');
          edit.addEventListener('click', () => openEdit(a));
          act.appendChild(edit);
          if (a.current) {
            const tfa = h('button', btnCls + ' text-blue-600', a.twofa_enabled ? '2FA 设置' : '开启 2FA');
            tfa.addEventListener('click', () => openTfa(a));
            act.appendChild(tfa);
          }
          const del = h('button', btnCls + ' text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10', '删除');
          del.addEventListener('click', () => doDelete(a));
          act.appendChild(del);
          tr.appendChild(act);
          tbody.appendChild(tr);
        });
      }

      async function load() {
        try {
          const r = await api('/api/admin/accounts');
          accounts = r.data || [];
          renderTable();
        } catch (e) { toast(e.message, 'error'); }
      }

      /* ---------- 新增/编辑弹窗 ---------- */
      const modal = document.getElementById('modal');
      function openModal() { modal.classList.remove('hidden'); document.getElementById('form-err').classList.add('hidden'); }
      function closeModal() { modal.classList.add('hidden'); }
      modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));

      function fillForm(a) {
        document.getElementById('f-id').value = a.id || '';
        const uname = document.getElementById('f-username');
        uname.value = a.username || '';
        uname.readOnly = !!a.id;
        document.getElementById('f-display').value = a.display_name || '';
        document.getElementById('f-role').value = a.role || 'admin';
        document.getElementById('f-password').value = '';
        document.getElementById('modal-title').textContent = a.id ? '编辑账号' : '新增账号';
        document.getElementById('username-hint').textContent = a.id ? '用户名创建后不可修改' : '长度 3-50 位';
        document.getElementById('pwd-label').textContent = a.id ? '重置密码（留空则不修改）' : '密码（6-72 位）';
      }

      function openAdd() { fillForm({}); openModal(); }
      function openEdit(a) { fillForm(a); openModal(); }
      document.getElementById('add-btn').addEventListener('click', openAdd);

      document.getElementById('acc-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const id = document.getElementById('f-id').value;
        const body = {
          username: document.getElementById('f-username').value.trim(),
          password: document.getElementById('f-password').value,
          display_name: document.getElementById('f-display').value.trim(),
          role: document.getElementById('f-role').value
        };
        const err = document.getElementById('form-err');
        try {
          if (id) {
            delete body.username; // 编辑时不允许改用户名
            await api('/api/admin/accounts/' + id + '/update', { method: 'POST', body });
          } else {
            await api('/api/admin/accounts/create', { method: 'POST', body });
          }
          closeModal();
          toast('保存成功', 'success');
          load();
        } catch (e) {
          err.textContent = e.message || '保存失败';
          err.classList.remove('hidden');
        }
      });

      async function doDelete(a) {
        if (a.current) { toast('不能删除当前登录账号', 'error'); return; }
        if (!confirm('确定删除账号「' + a.username + '」吗？')) return;
        try {
          await api('/api/admin/accounts/' + a.id + '/delete', { method: 'POST' });
          toast('已删除', 'success');
          load();
        } catch (e) { toast(e.message, 'error'); }
      }

      /* ---------- 两步验证弹窗 ---------- */
      const tfaModal = document.getElementById('tfa-modal');
      function openTfaModal() { tfaModal.classList.remove('hidden'); }
      function closeTfaModal() { tfaModal.classList.add('hidden'); }
      tfaModal.querySelectorAll('[data-tfa-close]').forEach(el => el.addEventListener('click', closeTfaModal));

      async function openTfa(a) {
        const body = document.getElementById('tfa-body');
        body.innerHTML = '';
        openTfaModal();

        if (a.twofa_enabled) {
          body.appendChild(h('div', 'text-sm text-slate-600 dark:text-slate-300', '该账号已启用两步验证。如需更换认证设备，请先关闭后重新开启。'));
          const disable = h('button', 'mt-4 px-4 py-2.5 rounded-lg bg-red-600 text-white text-sm font-medium', '关闭两步验证');
          disable.addEventListener('click', async () => {
            if (!confirm('确定关闭两步验证？关闭后登录将不再需要动态口令。')) return;
            try {
              await api('/api/admin/accounts/' + a.id + '/2fa/disable', { method: 'POST' });
              toast('两步验证已关闭', 'success');
              closeTfaModal();
              load();
            } catch (e) { toast(e.message, 'error'); }
          });
          body.appendChild(disable);
          return;
        }

        let r;
        try {
          r = await api('/api/admin/accounts/' + a.id + '/2fa/generate', { method: 'POST' });
        } catch (e) {
          body.appendChild(h('div', 'text-sm text-red-600', esc(e.message)));
          return;
        }

        body.appendChild(h('div', 'text-sm text-slate-600 dark:text-slate-300',
          '请在认证器 App（如 Google Authenticator / Microsoft Authenticator）中录入下方密钥，然后输入动态口令完成绑定。密钥仅显示这一次。'));

        const box = h('div', 'mt-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-800 space-y-3');
        box.appendChild(h('div', 'text-xs text-slate-400', '手动录入密钥'));
        const secretInput = h('input', 'w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-2 py-1.5 text-sm tabular');
        secretInput.value = r.secret;
        secretInput.readOnly = true;
        box.appendChild(secretInput);
        box.appendChild(h('div', 'text-xs text-slate-400', 'OTP 链接'));
        const uriInput = h('input', 'w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded px-2 py-1.5 text-sm');
        uriInput.value = r.otpauth;
        uriInput.readOnly = true;
        box.appendChild(uriInput);
        body.appendChild(box);

        const codeWrap = h('div', 'mt-4');
        codeWrap.appendChild(h('label', 'block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5', '动态口令'));
        const codeInput = h('input', inp);
        codeInput.placeholder = '6 位数字';
        codeInput.maxLength = 6;
        codeInput.inputMode = 'numeric';
        codeWrap.appendChild(codeInput);
        body.appendChild(codeWrap);

        const errEl = h('div', 'hidden mt-3 text-sm text-red-600 bg-red-50 dark:bg-red-500/10 rounded-lg px-3 py-2');
        body.appendChild(errEl);

        const confirmBtn = h('button', 'mt-4 w-full px-4 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium', '验证并启用');
        confirmBtn.addEventListener('click', async () => {
          try {
            await api('/api/admin/accounts/' + a.id + '/2fa/verify', {
              method: 'POST',
              body: { secret: r.secret, code: codeInput.value.trim() }
            });
            toast('两步验证已启用', 'success');
            closeTfaModal();
            load();
          } catch (e) {
            errEl.textContent = e.message || '启用失败';
            errEl.classList.remove('hidden');
          }
        });
        body.appendChild(confirmBtn);
      }

      load();
    })();
  })();
  </script>
</body>
</html>
