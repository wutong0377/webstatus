<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮件发送日志 - WebStatus 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="admin-shell"></div>
  <script src="/assets/js/common.js"></script>
  <script>
  (() => {
    const { api, esc, h, toast } = WebStatus;
    const sel = 'px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40';
    const inp = 'px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40';

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/mail-logs');
      const page = h('div', 'px-4 sm:px-6 py-6 max-w-6xl mx-auto');
      main.appendChild(page);
      page.appendChild(h('h1', 'text-xl font-bold mb-5', '邮件发送日志'));

      // 筛选
      const filter = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 mb-4 flex flex-wrap items-end gap-3');
      const fType = h('select', sel);
      [['all', '全部类型'], ['alert', '告警'], ['recover', '恢复'], ['test', '测试']].forEach(o => {
        const op = h('option', '', o[1]); op.value = o[0]; fType.appendChild(op);
      });
      const fStatus = h('select', sel);
      [['all', '全部状态'], ['1', '成功'], ['0', '失败']].forEach(o => {
        const op = h('option', '', o[1]); op.value = o[0]; fStatus.appendChild(op);
      });
      const fKeyword = h('input', inp);
      fKeyword.placeholder = '搜索收件邮箱';
      const btn = h('button', 'px-4 py-2 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium', '查询');
      [h('div', 'text-xs text-slate-400 pb-2', '类型'), h('div', 'text-xs text-slate-400 pb-2', '状态'), h('div', 'text-xs text-slate-400 pb-2', '关键字')].forEach((lb, i) => {
        const cell = h('div', '');
        cell.appendChild(lb);
        cell.appendChild([fType, fStatus, fKeyword][i]);
        filter.appendChild(cell);
      });
      filter.appendChild(h('div', 'flex-1 min-w-10', ''));
      filter.appendChild(btn);
      page.appendChild(filter);

      // 表格
      const box = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4');
      page.appendChild(box);
      const tableWrap = h('div', 'table-scroll');
      box.appendChild(tableWrap);
      const table = h('table', 'w-full text-sm');
      table.innerHTML = '<thead><tr class="text-left text-xs text-slate-400 border-b border-slate-200 dark:border-slate-800">' +
        '<th class="py-2.5 pr-3 font-medium">时间</th><th class="py-2.5 pr-3 font-medium">收件邮箱</th>' +
        '<th class="py-2.5 pr-3 font-medium">类型</th><th class="py-2.5 pr-3 font-medium">状态</th><th class="py-2.5 font-medium">失败原因</th></tr></thead>';
      const tbody = h('tbody', '');
      table.appendChild(tbody);
      tableWrap.appendChild(table);

      // 分页
      const pager = h('div', 'mt-4 flex items-center justify-between gap-3 flex-wrap');
      box.appendChild(pager);

      let pageNum = 1;
      let total = 0;

      async function load() {
        const q = new URLSearchParams({
          page: pageNum,
          size: 15,
          mail_type: fType.value,
          status: fStatus.value,
          keyword: fKeyword.value.trim()
        });
        try {
          const r = await api('/api/admin/mail-logs/?' + q.toString());
          total = r.total;
          tbody.innerHTML = '';
          if (!r.data.length) {
            tbody.appendChild(h('tr', '', '<td colspan="5" class="py-8 text-center text-slate-400">暂无记录</td>'));
          }
          r.data.forEach(m => {
            const tr = h('tr', 'border-b border-slate-100 dark:border-slate-800 last:border-0');
            const typeText = m.mail_type === 'alert' ? '告警' : m.mail_type === 'recover' ? '恢复' : '测试';
            tr.innerHTML = '<td class="py-2.5 pr-3 text-xs text-slate-500 tabular">' + esc(m.created_at) + '</td>' +
              '<td class="py-2.5 pr-3">' + esc(m.to_email) + '</td>' +
              '<td class="py-2.5 pr-3 text-xs text-slate-500">' + typeText + '</td>' +
              '<td class="py-2.5 pr-3"><span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset ' +
              (m.status === 1 ? 'bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-400' : 'bg-red-50 text-red-700 ring-red-600/20 dark:bg-red-500/10 dark:text-red-400') + '">' +
              (m.status === 1 ? '成功' : '失败') + '</span></td>' +
              '<td class="py-2.5 text-xs text-slate-400 max-w-[220px] truncate">' + esc(m.error_msg) + '</td>';
            tbody.appendChild(tr);
          });
          renderPager();
        } catch (e) { toast(e.message, 'error'); }
      }

      function renderPager() {
        const pages = Math.max(1, Math.ceil(total / 15));
        pager.innerHTML = '';
        pager.appendChild(h('span', 'text-xs text-slate-400', '共 ' + total + ' 条 · 第 ' + pageNum + ' / ' + pages + ' 页'));
        const btns = h('div', 'flex gap-2');
        const prev = h('button', 'px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-xs disabled:opacity-40', '上一页');
        prev.disabled = pageNum <= 1;
        prev.addEventListener('click', () => { pageNum--; load(); });
        btns.appendChild(prev);
        const next = h('button', 'px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-xs disabled:opacity-40', '下一页');
        next.disabled = pageNum >= pages;
        next.addEventListener('click', () => { pageNum++; load(); });
        btns.appendChild(next);
        pager.appendChild(btns);
      }

      btn.addEventListener('click', () => { pageNum = 1; load(); });
      load();
    })();
  })();
  </script>
</body>
</html>
