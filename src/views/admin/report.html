<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报表中心 - WebStatus 管理后台</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=2.1.0">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  <div id="admin-shell"></div>
  <script src="/assets/js/common.js?v=2.1.0"></script>
  <script>
  (() => {
    const { api, esc, h, toast } = WebStatus;
    const inp = 'w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500';

    const BLOCK_BG = {
      0: 'bg-slate-200 dark:bg-slate-700',
      1: 'bg-emerald-400',
      2: 'bg-amber-400',
      3: 'bg-red-500',
      4: 'bg-blue-500'
    };
    const BLOCK_TEXT = { 0: '无数据', 1: '正常', 2: '卡顿', 3: '离线', 4: '维修' };

    let sites = [];
    let avDays = 7;

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/report');
      const page = h('div', 'px-4 sm:px-6 py-6 max-w-6xl mx-auto space-y-6');
      main.appendChild(page);

      /* ---------- 顶部：站点选择 + 导出 ---------- */
      const topBar = h('div', 'flex items-center justify-between flex-wrap gap-3');
      topBar.appendChild(h('h1', 'text-xl font-bold', '报表'));
      const controls = h('div', 'flex items-center gap-2 flex-wrap');
      const siteSelect = h('select', 'w-56 ' + inp);
      siteSelect.id = 'site-select';
      siteSelect.innerHTML = '<option value="">请选择站点</option>';
      controls.appendChild(siteSelect);
      const daysSelect = h('select', 'w-28 ' + inp);
      daysSelect.id = 'days-select';
      daysSelect.innerHTML = '<option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option>';
      controls.appendChild(daysSelect);
      const exportBtn = h('button', 'px-4 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium', '导出 CSV');
      controls.appendChild(exportBtn);
      topBar.appendChild(controls);
      page.appendChild(topBar);

      /* ---------- 可用率表格 ---------- */
      const avBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl');
      page.appendChild(avBox);
      avBox.appendChild(h('div', 'px-5 pt-4 pb-2 text-sm font-semibold', '每日可用率'));
      const avTableWrap = h('div', 'overflow-x-auto px-2 pb-2');
      avBox.appendChild(avTableWrap);
      const avTable = h('table', 'w-full text-sm');
      avTable.innerHTML = '<thead><tr class="text-left text-xs text-slate-400 border-b border-slate-200 dark:border-slate-800">' +
        '<th class="px-4 py-2.5 font-medium">日期</th><th class="px-4 py-2.5 font-medium">可用率</th></tr></thead>';
      const avBody = h('tbody', '');
      avTable.appendChild(avBody);
      avTableWrap.appendChild(avTable);

      /* ---------- 状态方块图 ---------- */
      const blockBox = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5');
      page.appendChild(blockBox);
      blockBox.appendChild(h('div', 'text-sm font-semibold mb-3', '近 7 天状态方块图（每小时）'));
      const blockGrid = h('div', '');
      blockGrid.id = 'block-grid';
      blockBox.appendChild(blockGrid);

      /* ---------- 数据加载 ---------- */
      async function loadSites() {
        try {
          const r = await api('/api/admin/settings/site-options');
          sites = r.data || [];
          const opts = sites.map(s => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('');
          siteSelect.innerHTML = '<option value="">请选择站点</option>' + opts;
        } catch (e) { toast(e.message, 'error'); }
      }

      function currentSiteId() { return Number(siteSelect.value) || 0; }

      async function loadAvailability() {
        const siteId = currentSiteId();
        avBody.innerHTML = '';
        if (!siteId) {
          avBody.appendChild(h('tr', '', '<td colspan="2" class="px-4 py-8 text-center text-slate-400">请先选择站点</td>'));
          return;
        }
        try {
          const r = await api('/api/admin/report/availability?site_id=' + siteId + '&days=' + avDays);
          (r.data || []).forEach(row => {
            const tr = h('tr', 'border-b border-slate-100 dark:border-slate-800 last:border-0');
            tr.appendChild(h('td', 'px-4 py-2.5 text-xs text-slate-500 tabular', esc(row.date)));
            const cell = h('td', 'px-4 py-2.5');
            if (row.availability === null || row.availability === undefined) {
              cell.appendChild(h('span', 'text-xs text-slate-400', '无数据'));
            } else {
              const a = row.availability;
              const color = a >= 99.9 ? 'bg-emerald-500' : a >= 95 ? 'bg-emerald-400' : a >= 90 ? 'bg-amber-400' : 'bg-red-500';
              const wrap = h('div', 'flex items-center gap-2');
              const bar = h('div', 'w-40 h-2 rounded bg-slate-100 dark:bg-slate-800 overflow-hidden');
              const fill = h('div', 'h-full rounded ' + color);
              fill.style.width = Math.max(0, Math.min(100, a)) + '%';
              bar.appendChild(fill);
              wrap.appendChild(bar);
              wrap.appendChild(h('span', 'text-xs tabular text-slate-600 dark:text-slate-300', a + '%'));
              cell.appendChild(wrap);
            }
            tr.appendChild(cell);
            avBody.appendChild(tr);
          });
        } catch (e) { toast(e.message, 'error'); }
      }

      async function loadBlocks() {
        const siteId = currentSiteId();
        blockGrid.innerHTML = '';
        if (!siteId) {
          blockGrid.appendChild(h('div', 'text-sm text-slate-400', '请先选择站点'));
          return;
        }
        try {
          const r = await api('/api/admin/report/blocks?site_id=' + siteId + '&days=7');
          const data = r.data || [];

          const legend = h('div', 'flex items-center gap-3 text-xs text-slate-400 mb-3 flex-wrap');
          legend.appendChild(h('span', '', '图例：'));
          [['正常', 'bg-emerald-400'], ['卡顿', 'bg-amber-400'], ['离线', 'bg-red-500'], ['维修', 'bg-blue-500'], ['无数据', 'bg-slate-200 dark:bg-slate-700']].forEach(pair => {
            legend.appendChild(h('span', 'flex items-center gap-1', '<span class="w-3 h-3 rounded-sm ' + pair[1] + '"></span>' + pair[0]));
          });
          blockGrid.appendChild(legend);

          const days = 7;
          const hpd = 24;
          for (let d = 0; d < days; d++) {
            const row = h('div', 'flex items-center gap-2 mb-1.5');
            const label = h('span', 'w-24 text-xs text-slate-400 flex-shrink-0', esc(data[d * hpd] ? String(data[d * hpd].time).slice(0, 10) : ''));
            row.appendChild(label);
            const cells = h('div', 'flex-1 grid gap-[2px]');
            cells.style.gridTemplateColumns = 'repeat(24, minmax(0, 1fr))';
            for (let h = 0; h < hpd; h++) {
              const item = data[d * hpd + h];
              if (!item) continue;
              const blk = h('div', 'aspect-square rounded-[3px] ' + (BLOCK_BG[item.status] || BLOCK_BG[0]));
              blk.title = item.time + ' · ' + (BLOCK_TEXT[item.status] || '未知');
              cells.appendChild(blk);
            }
            row.appendChild(cells);
            blockGrid.appendChild(row);
          }
        } catch (e) { toast(e.message, 'error'); }
      }

      /* ---------- 事件绑定 ---------- */
      siteSelect.addEventListener('change', () => { loadAvailability(); loadBlocks(); });
      daysSelect.addEventListener('change', () => {
        avDays = Number(daysSelect.value) || 7;
        loadAvailability();
      });
      exportBtn.addEventListener('click', () => {
        const siteId = currentSiteId();
        if (!siteId) { toast('请先选择站点', 'error'); return; }
        window.open('/api/admin/report/export?site_id=' + siteId + '&days=' + avDays, '_blank');
      });

      await loadSites();
      loadAvailability();
      loadBlocks();
    })();
  })();
  </script>
</body>
</html>
