<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话管理 - WebStatus 管理后台</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=2.0.0">
</head>
<body>
  <div id="admin-shell"></div>

  <script src="/assets/js/common.js?v=2.0.0"></script>
  <script>
  (() => {
    const { api, esc, h, toast } = WebStatus;

    (async () => {
      const main = await WebStatus.renderAdminShell('/admin/sessions');
      const page = h('div', 'px-4 sm:px-6 py-6 max-w-5xl mx-auto');
      main.appendChild(page);

      page.appendChild(h('div', 'flex items-center justify-between mb-5 flex-wrap gap-3',
        '<h1 class="text-xl font-bold">会话管理</h1>' +
        '<span class="text-xs text-slate-400">强制下线后，对应会话的下一次请求将被自动登出</span>'));

      const box = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden');
      page.appendChild(box);
      const tableWrap = h('div', 'overflow-x-auto');
      box.appendChild(tableWrap);
      const table = h('table', 'w-full text-sm');
      table.innerHTML = '<thead><tr class="text-left text-xs text-slate-400 border-b border-slate-200 dark:border-slate-800">' +
        '<th class="px-4 py-3 font-medium">账号</th>' +
        '<th class="px-4 py-3 font-medium">IP</th>' +
        '<th class="px-4 py-3 font-medium">用户代理</th>' +
        '<th class="px-4 py-3 font-medium">创建时间</th>' +
        '<th class="px-4 py-3 font-medium">最近活跃</th>' +
        '<th class="px-4 py-3 font-medium">状态</th>' +
        '<th class="px-4 py-3 font-medium text-right">操作</th></tr></thead>';
      const tbody = h('tbody', '');
      table.appendChild(tbody);
      tableWrap.appendChild(table);

      function statusBadge(s) {
        if (s.current) return '<span class="px-2 py-0.5 rounded-full text-xs bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-600/20 dark:bg-blue-500/10 dark:text-blue-400">当前</span>';
        if (s.revoked) return '<span class="px-2 py-0.5 rounded-full text-xs bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/20 dark:bg-red-500/10 dark:text-red-400">已下线</span>';
        return '<span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-400">在线</span>';
      }

      function render(rows) {
        tbody.innerHTML = '';
        if (!rows.length) {
          tbody.appendChild(h('tr', '', '<td colspan="7" class="px-4 py-10 text-center text-slate-400">暂无会话记录</td>'));
          return;
        }
        rows.forEach(s => {
          const tr = h('tr', 'border-b border-slate-100 dark:border-slate-800 last:border-0 hover:bg-slate-50 dark:hover:bg-slate-800/50');
          const cell = c => 'px-4 py-3 ' + c;

          const nameCell = h('td', cell(''));
          nameCell.appendChild(h('div', 'font-medium', esc(s.username)));
          if (s.display_name) nameCell.appendChild(h('div', 'text-xs text-slate-400', esc(s.display_name)));
          tr.appendChild(nameCell);

          tr.appendChild(h('td', cell('text-xs text-slate-500 tabular'), esc(s.ip || '-')));
          const ua = s.user_agent || '-';
          tr.appendChild(h('td', cell('text-xs text-slate-500 max-w-[220px] truncate'), esc(ua)));
          tr.appendChild(h('td', cell('text-xs text-slate-500'), esc(s.created_at)));
          tr.appendChild(h('td', cell('text-xs text-slate-500'), esc(s.last_active_at)));
          tr.appendChild(h('td', cell(''), statusBadge(s)));

          const act = h('td', cell('text-right whitespace-nowrap'));
          const revoke = h('button',
            'px-2.5 py-1.5 rounded-lg text-xs ' +
            (s.current || s.revoked
              ? 'text-slate-300 dark:text-slate-600 cursor-not-allowed'
              : 'text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10'),
            '强制下线');
          if (!s.current && !s.revoked) {
            revoke.addEventListener('click', () => doRevoke(s));
          }
          act.appendChild(revoke);
          tr.appendChild(act);
          tbody.appendChild(tr);
        });
      }

      async function doRevoke(s) {
        if (!confirm('确定强制下线该会话？对方的下一次请求将被自动登出。')) return;
        try {
          await api('/api/admin/sessions/' + s.id + '/revoke', { method: 'POST' });
          toast('已强制下线', 'success');
          load();
        } catch (e) { toast(e.message, 'error'); }
      }

      async function load() {
        try {
          const r = await api('/api/admin/sessions');
          render(r.data || []);
        } catch (e) { toast(e.message, 'error'); }
      }

      load();
      setInterval(load, 15000); // 自动刷新，及时反映状态变化
    })();
  })();
  </script>
</body>
</html>
