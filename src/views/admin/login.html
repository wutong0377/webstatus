<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - WebStatus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-blue-600">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 mx-auto"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <h1 class="text-xl font-bold mt-3">WebStatus 管理后台</h1>
      <p class="text-sm text-slate-400 mt-1">网站状态监控系统</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">用户名</label>
          <input id="username" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" autocomplete="username" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">密码</label>
          <input id="password" type="password" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" autocomplete="current-password" required>
        </div>
        <div id="err" class="hidden text-sm text-red-600 bg-red-50 dark:bg-red-500/10 rounded-lg px-3 py-2"></div>
        <button type="submit" class="w-full px-4 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium hover:opacity-90 disabled:opacity-50">登录</button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      <a href="/" class="hover:underline">← 返回状态面板</a>
    </p>
  </div>

  <script src="/assets/js/common.js"></script>
  <script>
  (() => {
    const { api, setCsrf } = WebStatus;
    const $ = s => document.querySelector(s);

    (async () => {
      try {
        const st = await api('/api/auth/status');
        setCsrf(st.csrfToken);
        if (st.loggedIn) { location.href = '/admin/dashboard'; return; }
      } catch (e) { /* ignore */ }

      $('#login-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const btn = ev.target.querySelector('button');
        const err = $('#err');
        btn.disabled = true; btn.textContent = '登录中...';
        err.classList.add('hidden');
        try {
          const r = await api('/api/auth/login', {
            method: 'POST',
            body: { username: $('#username').value.trim(), password: $('#password').value }
          });
          if (r.csrfToken) WebStatus.setCsrf(r.csrfToken);
          location.href = '/admin/dashboard';
        } catch (e) {
          err.textContent = e.message || '登录失败';
          err.classList.remove('hidden');
          btn.disabled = false; btn.textContent = '登录';
        }
      });
    })();
  })();
  </script>
</body>
</html>
