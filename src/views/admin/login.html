<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - WebStatus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 flex items-center justify-center p-4">
  <div class="fixed top-4 right-4 z-50" id="lang-holder"></div>
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-blue-600">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 mx-auto"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <h1 class="text-xl font-bold mt-3" data-i18n="login.title">WebStatus 管理后台</h1>
      <p class="text-sm text-slate-400 mt-1" data-i18n="login.subtitle">网站状态监控系统</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="login.username">用户名</label>
          <input id="username" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" autocomplete="username" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="login.password">密码</label>
          <input id="password" type="password" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500" autocomplete="current-password" required>
        </div>
        <div id="err" class="hidden text-sm text-red-600 bg-red-50 dark:bg-red-500/10 rounded-lg px-3 py-2"></div>
        <!-- 2FA 动态口令第二步（账号启用二次验证时显示） -->
        <div id="2fa-wrap" class="hidden space-y-3">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">动态口令</label>
            <input id="totp" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500" placeholder="6 位验证码" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          </div>
          <button type="button" id="verify-2fa-btn" class="w-full px-4 py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:opacity-90 disabled:opacity-50">验证并登录</button>
          <button type="button" id="cancel-2fa-btn" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800">返回重新登录</button>
        </div>
        <button type="submit" id="login-btn" class="w-full px-4 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium hover:opacity-90 disabled:opacity-50" data-i18n="login.submit">登录</button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      <a href="/" class="hover:underline" data-i18n="login.back">← 返回状态面板</a>
    </p>
    <div id="ws-copyright" class="mt-3"></div>
  </div>

  <script src="/assets/js/common.js"></script>
  <script>
  (() => {
    const { api, setCsrf, t } = WebStatus;
    const $ = s => document.querySelector(s);
    let tempToken = null; // 2FA 临时票据

    // 语言切换按钮
    if (typeof WebStatus.langBtn === 'function') $('#lang-holder').appendChild(WebStatus.langBtn());
    // 版权渲染（校验失败会停止渲染）
    WebStatus.renderCopyright();

    (async () => {
      try {
        const st = await api('/api/auth/status');
        setCsrf(st.csrfToken);
        if (st.loggedIn) { location.href = '/admin/dashboard'; return; }
      } catch (e) { /* ignore */ }

      $('#login-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const btn = ev.target.querySelector('button');
        const err = $('#err');
        btn.disabled = true; btn.textContent = t('login.loggingIn');
        err.classList.add('hidden');
        try {
          const r = await api('/api/auth/login', {
            method: 'POST',
            body: { username: $('#username').value.trim(), password: $('#password').value }
          });
          if (r.need2fa) {
            // 账号启用 2FA：进入第二步动态口令验证
            tempToken = r.tempToken;
            $('#login-form').classList.add('hidden');
            $('#2fa-wrap').classList.remove('hidden');
            $('#totp').focus();
            btn.disabled = false; btn.textContent = t('login.submit');
            return;
          }
          if (r.csrfToken) WebStatus.setCsrf(r.csrfToken);
          location.href = '/admin/dashboard';
        } catch (e) {
          err.textContent = e.message || t('login.failed');
          err.classList.remove('hidden');
          btn.disabled = false; btn.textContent = t('login.submit');
        }
      });

      // 2FA 动态口令验证
      $('#verify-2fa-btn').addEventListener('click', async () => {
        const code = $('#totp').value.trim();
        const err = $('#err');
        if (!code) { err.textContent = '请输入动态口令'; err.classList.remove('hidden'); return; }
        const vbtn = $('#verify-2fa-btn');
        vbtn.disabled = true; vbtn.textContent = '验证中...';
        err.classList.add('hidden');
        try {
          const r = await api('/api/auth/verify-2fa', { method: 'POST', body: { tempToken, code } });
          if (r.csrfToken) WebStatus.setCsrf(r.csrfToken);
          location.href = '/admin/dashboard';
        } catch (e) {
          err.textContent = e.message || '验证失败';
          err.classList.remove('hidden');
          vbtn.disabled = false; vbtn.textContent = '验证并登录';
        }
      });

      // 返回重新登录
      $('#cancel-2fa-btn').addEventListener('click', () => {
        tempToken = null;
        $('#2fa-wrap').classList.add('hidden');
        $('#login-form').classList.remove('hidden');
        $('#totp').value = '';
      });
    })();
  })();
  </script>
</body>
</html>
