<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站状态监控 WebStatus</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=2.4.0">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

  <!-- 顶栏 -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="text-blue-600 flex-shrink-0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </span>
        <span class="font-semibold whitespace-nowrap">WebStatus</span>
        <span class="text-xs text-slate-400 hidden sm:inline truncate" data-i18n="app.subtitle">网站状态监控</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5 flex">
          <button id="view-card" class="px-2.5 py-1.5 rounded-md text-xs font-medium" data-i18n="home.cardView">卡片</button>
          <button id="view-list" class="px-2.5 py-1.5 rounded-md text-xs font-medium" data-i18n="home.listView">列表</button>
        </div>
        <span id="lang-btn" class="inline-flex"></span>
        <button id="theme-btn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"></button>
        <button id="refresh-btn" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-medium hover:opacity-90">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span data-i18n="home.refreshNow">获取最新情况</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 维护窗口 -->
  <div class="max-w-6xl mx-auto px-4 mt-4">
    <div id="window-bar" class="hidden space-y-2"></div>
  </div>

  <!-- 公告栏 -->
  <div class="max-w-6xl mx-auto px-4 mt-4">
    <div id="notice-bar" class="hidden"></div>
  </div>

  <!-- 统计 -->
  <div class="max-w-6xl mx-auto px-4 mt-4">
    <div id="stat-row" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
  </div>

  <!-- 站点 -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div id="site-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="site-list" class="hidden space-y-2"></div>
    <div id="empty" class="hidden mt-16 text-center">
      <div class="text-slate-300 dark:text-slate-700 mb-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-14 h-14 mx-auto"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <p class="text-slate-400" data-i18n="home.empty">暂无监控站点</p>
    </div>
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-8 text-center text-xs text-slate-400">
    Powered by WebStatus · <span data-i18n="home.footer">开源自托管网站状态监控系统</span>
    <div id="ws-copyright" class="mt-2"></div>
  </footer>

  <script src="/assets/js/common.js?v=2.4.0"></script>
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const { api, esc, h, icon, toast, STATUS_META, fmtDelay, t, tStatus, skeleton } = WebStatus;

    let sites = [];
    let miniData = {};
    let availMap = {};
    let refreshSec = 30;
    let view = localStorage.getItem('ws_view') || 'card';

    /* ---------- 视图切换 ---------- */
    function applyView() {
      const grid = $('#site-grid');
      const list = $('#site-list');
      if (!sites.length) return;
      if (view === 'card') { grid.classList.remove('hidden'); list.classList.add('hidden'); }
      else { list.classList.remove('hidden'); grid.classList.add('hidden'); }
      $('#view-card').classList.toggle('bg-white', view === 'card');
      $('#view-card').classList.toggle('shadow-sm', view === 'card');
      $('#view-list').classList.toggle('bg-white', view === 'list');
      $('#view-list').classList.toggle('shadow-sm', view === 'list');
    }
    $('#view-card').addEventListener('click', () => { view = 'card'; localStorage.setItem('ws_view', 'card'); applyView(); });
    $('#view-list').addEventListener('click', () => { view = 'list'; localStorage.setItem('ws_view', 'list'); applyView(); });

    /* ---------- 语言切换按钮 ---------- */
    $('#lang-btn').appendChild(WebStatus.langBtn());

    /* ---------- 主题 ---------- */
    const themeBtn = $('#theme-btn');
    themeBtn.innerHTML = icon('moon', 'w-5 h-5');
    themeBtn.addEventListener('click', () => {
      WebStatus.toggleTheme();
      themeBtn.innerHTML = icon(WebStatus.isDark ? 'sun' : 'moon', 'w-5 h-5');
    });

    /* ---------- 骨架占位 ---------- */
    function showSkeleton() {
      const row = $('#stat-row');
      row.innerHTML = '';
      for (let i = 0; i < 4; i++) row.appendChild(skeleton('h-16'));
      const grid = $('#site-grid');
      grid.innerHTML = '';
      grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';
      for (let i = 0; i < 6; i++) grid.appendChild(skeleton('h-40'));
    }

    /* ---------- 维护窗口（v2） ---------- */
    function renderWindows(windows) {
      const bar = $('#window-bar');
      if (!bar) return;
      if (!windows || !windows.length) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      bar.innerHTML = '';
      windows.forEach(w => {
        const item = h('div', 'bg-blue-50 dark:bg-blue-500/10 border border-blue-200 dark:border-blue-500/20 rounded-xl p-3.5 flex items-start gap-3');
        item.innerHTML = '<span class="text-blue-500 flex-shrink-0 mt-0.5">' + icon('wrench', 'w-4 h-4') + '</span>';
        const content = h('div', 'min-w-0 text-sm');
        content.appendChild(h('div', 'font-medium text-blue-700 dark:text-blue-300', esc(w.title || '维护中')));
        const line = h('div', 'mt-0.5 text-xs text-blue-600 dark:text-blue-400');
        line.textContent = (w.site_name ? ('站点：' + w.site_name + ' · ') : '') + '维护时段 ' + esc(w.start_at) + ' → ' + esc(w.end_at);
        content.appendChild(line);
        item.appendChild(content);
        bar.appendChild(item);
      });
    }

    /* ---------- 公告 ---------- */
    function renderNotices(notices) {
      const bar = $('#notice-bar');
      if (!notices.length) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      bar.innerHTML = '';
      notices.forEach(n => {
        const item = h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3.5 mb-2 flex items-start gap-3');
        item.innerHTML = '<span class="text-blue-500 flex-shrink-0 mt-0.5">' + icon('megaphone', 'w-4 h-4') + '</span>';
        const content = h('div', 'min-w-0 text-sm');
        const title = h('div', 'font-medium' + (n.is_pinned ? ' text-blue-600 dark:text-blue-400' : ''));
        title.textContent = n.title;
        content.appendChild(title);
        if (n.content) content.appendChild(h('div', 'mt-1 text-slate-500 dark:text-slate-400 text-sm', n.content));
        item.appendChild(content);
        bar.appendChild(item);
      });
    }

    /* ---------- 统计 ---------- */
    function renderStats() {
      const counts = { up: 0, slow: 0, down: 0, maintenance: 0 };
      sites.forEach(s => {
        if (s && s.status === 1) counts.up++;
        else if (s && s.status === 2) counts.slow++;
        else if (s && s.status === 3) counts.down++;
        else if (s && s.status === 4) counts.maintenance++;
      });
      const items = [
        { label: t('status.up'), val: counts.up, cls: 'text-emerald-600 dark:text-emerald-400' },
        { label: t('status.slow'), val: counts.slow, cls: 'text-amber-600 dark:text-amber-400' },
        { label: t('status.down'), val: counts.down, cls: 'text-red-600 dark:text-red-400' },
        { label: t('status.maintenance'), val: counts.maintenance, cls: 'text-blue-600 dark:text-blue-400' }
      ];
      const row = $('#stat-row');
      row.innerHTML = '';
      items.forEach(it => {
        row.appendChild(h('div', 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 flex items-center justify-between',
          '<span class="text-sm text-slate-500">' + esc(it.label) + '</span><span class="text-2xl font-semibold tabular ' + it.cls + '">' + it.val + '</span>'));
      });
    }

    /* ---------- 卡片（每个字段都做空值兜底，单点异常不拖垮整页） ---------- */
    function card(s) {
      if (!s) return null;
      const meta = STATUS_META[s.status] || STATUS_META[0];
      const el = h('a', 'card-hover bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 block h-full flex flex-col');
      el.href = '/site/' + (s.id || '');
      const showErr = s.status === 3;

      const head = h('div', 'flex items-start justify-between gap-2');
      const titleWrap = h('div', 'flex items-center gap-3 min-w-0');
      if (s.icon_url) {
        const img = h('img', 'w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 object-contain p-1 flex-shrink-0');
        img.src = s.icon_url;
        img.referrerPolicy = 'no-referrer';
        img.onerror = () => { if (img.parentNode) img.replaceWith(iconWrap()); };
        titleWrap.appendChild(img);
      } else {
        titleWrap.appendChild(iconWrap());
      }
      const nameWrap = h('div', 'min-w-0');
      nameWrap.appendChild(h('div', 'font-semibold truncate', esc(s.name)));
      nameWrap.appendChild(h('div', 'text-xs text-slate-400 truncate', esc(s.domain)));
      titleWrap.appendChild(nameWrap);
      head.appendChild(titleWrap);
      head.appendChild(h('span', 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset ' + meta.badge + ' flex-shrink-0',
        icon(meta.icon, 'w-3.5 h-3.5') + '<span>' + esc(tStatus(s.status)) + '</span>'));
      el.appendChild(head);

      if (s.description) {
        el.appendChild(h('p', 'mt-2 text-sm text-slate-500 dark:text-slate-400', esc(s.description)));
      }
      if (s.maintenance === 1 && s.maintenance_note) {
        el.appendChild(h('div', 'mt-2 text-xs text-blue-600 dark:text-blue-400', esc(t('home.maintenance')) + esc(s.maintenance_note)));
      }

      const metrics = h('div', 'mt-auto grid grid-cols-3 gap-2 text-center pt-3');
      metrics.innerHTML =
        '<div class="bg-slate-50 dark:bg-slate-800 rounded-lg py-1.5"><div class="text-[11px] text-slate-400">' + esc(t('home.metric.delay')) + '</div><div class="text-sm font-medium tabular">' + fmtDelay(s.last_delay) + '</div></div>' +
        '<div class="bg-slate-50 dark:bg-slate-800 rounded-lg py-1.5"><div class="text-[11px] text-slate-400">' + esc(t('home.metric.code')) + '</div><div class="text-sm font-medium tabular">' + (s.last_http_code ? esc(s.last_http_code) : '-') + '</div></div>' +
        '<div class="bg-slate-50 dark:bg-slate-800 rounded-lg py-1.5"><div class="text-[11px] text-slate-400">' + esc(t('home.metric.checked')) + '</div><div class="text-sm font-medium tabular text-xs">' + (s.last_checked_at ? esc(String(s.last_checked_at).slice(5, 16)) : '-') + '</div></div>';
      el.appendChild(metrics);

      // 状态方块图（近 96 个探测点，一个方块一个状态）
      const blocks = (miniData && miniData[s.id]) || [];
      if (blocks.length) {
        const bg = h('div', 'mt-3 grid gap-[2px]');
        bg.style.gridTemplateColumns = 'repeat(24, minmax(0, 1fr))';
        blocks.slice(-96).forEach(p => {
          const m = (p && STATUS_META[p.status]) || STATUS_META[0];
          const sq = h('div', 'aspect-square rounded-[2px] ' + m.dot);
          sq.title = (p.checked_at || '') + ' · ' + (p.status == null ? '-' : tStatus(p.status));
          bg.appendChild(sq);
        });
        el.appendChild(bg);
      }

      // 可用率 + 证书/域名状态
      const metaRow = h('div', 'mt-2.5 flex items-center justify-between gap-2 text-[11px] flex-wrap');
      const left = h('div', 'flex items-center gap-2 text-slate-500');
      if (availMap[s.id] != null) left.appendChild(h('span', 'tabular', '近7天 ' + availMap[s.id] + '%'));
      if (Number(s.check_cert) === 1 && s.cert_status != null) {
        left.appendChild(h('span', 'flex items-center gap-0.5 ' + (Number(s.cert_status) === 1 ? 'text-emerald-500' : Number(s.cert_status) === 2 ? 'text-amber-500' : 'text-red-500'),
          (Number(s.cert_status) === 1 ? '' : Number(s.cert_status) === 2 ? '· 证书预警' : '· 证书异常')));
      }
      if (Number(s.check_domain) === 1 && s.domain_status != null) {
        left.appendChild(h('span', 'flex items-center gap-0.5 ' + (Number(s.domain_status) === 1 ? 'text-emerald-500' : Number(s.domain_status) === 2 ? 'text-amber-500' : 'text-red-500'),
          (Number(s.domain_status) === 1 ? '' : Number(s.domain_status) === 2 ? '· 域名预警' : '· 域名异常')));
      }
      if (left.childNodes.length) metaRow.appendChild(left);
      el.appendChild(metaRow);

      if (showErr && s.last_error_code) {
        el.appendChild(h('div', 'mt-3 text-xs text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-500/10 rounded-lg p-2.5',
          '<strong>' + esc(s.last_error_code) + '</strong> · ' + esc(s.last_error_msg || t('home.probeError'))));
      }
      return el;
    }

    function iconWrap() {
      return h('div', 'w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 flex-shrink-0', icon('globe', 'w-5 h-5'));
    }

    /* ---------- 列表行 ---------- */
    function row(s) {
      if (!s) return null;
      const meta = STATUS_META[s.status] || STATUS_META[0];
      const el = h('a', 'card-hover bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3.5 flex items-center gap-3 block');
      el.href = '/site/' + (s.id || '');
      el.appendChild(h('span', 'w-2.5 h-2.5 rounded-full flex-shrink-0 ' + meta.dot));
      const nameWrap = h('div', 'min-w-0 flex-1');
      nameWrap.appendChild(h('div', 'font-medium truncate', esc(s.name)));
      nameWrap.appendChild(h('div', 'text-xs text-slate-400 truncate', esc(s.domain)));
      el.appendChild(nameWrap);
      el.appendChild(h('div', 'hidden sm:block text-sm tabular text-slate-500', esc(t('home.metric.delay')) + ' ' + fmtDelay(s.last_delay)));
      el.appendChild(h('span', 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset flex-shrink-0 ' + meta.badge,
        icon(meta.icon, 'w-3.5 h-3.5') + '<span>' + esc(tStatus(s.status)) + '</span>'));
      return el;
    }

    /* ---------- 网格自适应：1 个单列居中，2-3 个双列，多则三列 ---------- */
    function gridClasses(n) {
      if (n <= 1) return 'grid grid-cols-1 max-w-2xl mx-auto gap-4';
      if (n <= 3) return 'grid grid-cols-1 sm:grid-cols-2 gap-4';
      return 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';
    }

    /* ---------- 渲染 ---------- */
    function renderSites() {
      const grid = $('#site-grid');
      const list = $('#site-list');
      const empty = $('#empty');
      grid.innerHTML = '';
      list.innerHTML = '';
      if (!sites.length) {
        empty.classList.remove('hidden');
        grid.classList.add('hidden');
        list.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');
      grid.className = gridClasses(sites.length);
      applyView();
      if (view === 'card') sites.forEach(s => { try { const c = card(s); if (c) grid.appendChild(c); } catch (e) { /* 单卡异常不中断 */ } });
      else sites.forEach(s => { try { const r = row(s); if (r) list.appendChild(r); } catch (e) { /* 单行异常不中断 */ } });
    }

    /* ---------- 拉取数据 ---------- */
    async function load() {
      try {
        const r = await api('/api/public/status');
        refreshSec = r.refresh || 30;
        sites = (r.data || []).filter(Boolean);
        try { renderWindows(r.windows || []); } catch (e) { /* 维护窗口渲染失败不影响主流程 */ }
        const ids = sites.map(s => s.id).join(',');
        if (ids) {
          const m = await api('/api/public/mini-timeline?id=' + ids).catch(() => ({ data: {} }));
          miniData = m.data || {};
        } else { miniData = {}; }
        try {
          const a = await api('/api/public/availability').catch(() => ({ data: {} }));
          availMap = a.data || {};
        } catch (e) { availMap = {}; }
        try { renderStats(); } catch (e) { /* 统计异常不中断 */ }
        renderSites();
      } catch (e) {
        // 未安装状态，服务端会重定向；静默即可
      }
    }

    async function loadNotices() {
      try {
        const r = await api('/api/public/notices');
        renderNotices(r.data || []);
      } catch (e) { /* ignore */ }
    }

    // 切换语言时重渲染统计与站点（使用已缓存数据，无需重新请求）
    document.addEventListener('ws-langchange', () => {
      if (sites.length) { try { renderStats(); } catch (e) {} renderSites(); }
    });

    // 防抖轮询：页面不可见时不请求
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') load();
    });

    showSkeleton();
    load();
    loadNotices();
    // 递归 setTimeout：刷新间隔随配置即时生效（比固定 setInterval 更准确）
    (function poll() {
      setTimeout(() => {
        if (document.visibilityState !== 'hidden') { load(); loadNotices(); }
        poll();
      }, Math.max(5, refreshSec) * 1000);
    })();

    /* ---------- 「获取最新情况」手动触发 + 极验人机验证 ---------- */
    function doRefresh(payload) {
      const btn = $('#refresh-btn');
      if (btn) { btn.disabled = true; btn.querySelector('span').textContent = t('home.refreshing'); }
      api('/api/public/run-check', { method: 'POST', body: payload || {} })
        .then(r => { toast((r && r.message) || t('home.refreshDone'), 'success'); load(); loadNotices(); })
        .catch(e => {
          if (e.code === 403 && e.message && e.message.indexOf('人机验证') !== -1) { openCaptcha(); }
          else toast(e.message || t('common.loadFailed'), 'error');
        })
        .finally(() => { if (btn) { btn.disabled = false; btn.querySelector('span').textContent = t('home.refreshNow'); } });
    }

    function openCaptcha() {
      if (typeof initGeetest !== 'function') {
        toast('人机验证组件加载失败，请稍后再试', 'error');
        return;
      }
      api('/api/public/captcha/init').then(r => {
        if (!r.data || !r.data.enabled) { doRefresh(); return; }
        initGeetest({
          gt: r.data.gt,
          challenge: r.data.challenge,
          new_captcha: r.data.new_captcha
        }, captchaObj => {
          captchaObj.onReady(() => captchaObj.showCaptcha());
          captchaObj.onSuccess(() => {
            const res = captchaObj.getValidate();
            doRefresh(res); // { gt, challenge, validate, seccode }
          });
          captchaObj.onError(() => toast('人机验证出错，请重试', 'error'));
        });
      }).catch(e => toast(e.message || '初始化失败', 'error'));
    }

    const refreshBtn = $('#refresh-btn');
    if (refreshBtn) refreshBtn.addEventListener('click', () => doRefresh());

    // 加载极验 SDK（未配置时仅首次点击直接触发，不加载 SDK）
    if (typeof initGeetest !== 'function') {
      const s = document.createElement('script');
      s.src = 'https://static.geetest.com/static/tools/gt.js';
      document.head.appendChild(s);
    }

    // 版权渲染（校验失败会停止页面渲染）
    WebStatus.renderCopyright();
  })();
  </script>
</body>
</html>
